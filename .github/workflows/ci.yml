name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene-and-contracts:
    name: Hygiene & Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate Contract Schemas & Examples
        run: python tools/validate_contracts.py

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Secret Scan (Gitleaks)
        run: gitleaks detect --verbose --redact

      - name: Install npm dependencies
        run: bun install --frozen-lockfile

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0

      - name: Verify Dependency Licenses
        run: python tools/check_licenses.py

  go-suite:
    name: Go Modular Monolith Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Go Test with Race Detector
        run: go test -race -v ./...

      - name: Build Go API Server
        run: |
          mkdir -p bin
          go build -o bin/ibj-api ./cmd/ibj-api

  ts-and-e2e:
    name: TypeScript SDK & Storefront E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck SDK and Demo Storefront
        run: |
          cd sdk && bun run typecheck
          cd ../demo-storefront && bun run typecheck

      - name: SDK Unit Tests (Vitest)
        run: cd sdk && bun run test

      - name: Build Artifacts
        run: |
          mkdir -p bin
          go build -o bin/ibj-api ./cmd/ibj-api
          cd sdk && bun run build
          cd ..
          bun build sdk/src/index.ts --outfile demo-storefront/public/sdk.js --target browser

      - name: Install Playwright Chromium & System Dependencies
        run: bun x playwright install --with-deps chromium

      - name: Run Playwright E2E & Accessibility Tests
        run: cd demo-storefront && bun run test:e2e

      - name: Upload Test Artifacts (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            demo-storefront/screenshots/
            test-results/
            playwright-report/
          retention-days: 7
